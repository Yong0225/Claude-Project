<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A2 代码动画 Demo</title>
<style>
:root{--red:#E8232A;--red-d:#B5121A;--ink:#1a1a1a;--bg:#FFF4EC;--green:#18B04A;--yellow:#FFC21A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 4px;font-weight:900;letter-spacing:.5px}
.sub{margin:0 0 18px;color:#7a625a;font-size:14px;line-height:1.5}
.stage{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.side{background:var(--red);border-radius:30px;padding:22px 20px 10px;color:#fff;position:relative;overflow:hidden;min-height:560px;display:flex;flex-direction:column;border:3px solid var(--ink)}
.side::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:var(--red-d);opacity:.55}
.logo{font-weight:900;font-size:30px;position:relative}
.nav{margin-top:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.nav div{background:rgba(255,255,255,.15);border-radius:16px;padding:11px 14px;font-weight:800;font-size:15px}
.nav div.on{background:#fff;color:var(--red)}
#m{margin-top:auto;width:100%;display:block;cursor:pointer;touch-action:manipulation;overflow:visible}
.panel{background:#fff;border-radius:30px;padding:20px;border:3px solid var(--ink)}
.panel h2{margin:0 0 12px;font-size:17px;font-weight:900}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btns button{font:inherit;font-weight:800;font-size:14px;padding:12px 6px;border-radius:16px;border:3px solid var(--ink);background:#FFE7DA;color:var(--ink);cursor:pointer;transition:transform .12s}
.btns button:active{transform:scale(.95)}
.btns button.on{background:var(--red);color:#fff}
.clock{margin-top:16px;width:100%;font:inherit;font-weight:900;font-size:22px;padding:18px;border-radius:22px;border:3px solid var(--ink);background:var(--green);color:#fff;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.clock:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.clock.out{background:#FF8A1F}
.tips{margin:16px 0 0;padding:0;list-style:none;font-size:14px;color:#5b4a44;line-height:1.7}
.tips li::before{content:"● ";color:var(--red)}
.fps{position:absolute;right:14px;bottom:12px;font-size:12px;font-weight:800;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px}
@media (max-width:720px){
  .stage{grid-template-columns:1fr}
  .side{min-height:0;padding:14px 16px 6px}
  .side .nav{display:none}
  .logo{font-size:22px}
  #m{max-width:230px;margin:-6px auto 0}
  .wrap{padding-top:14px}
  .sub{margin-bottom:12px}
  .btns{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>A2 小厨师 · 代码动画</h1>
  <p class="sub">整只角色都是 SVG 矢量图，动作全部用代码实时算出来，没有用视频或图片。</p>

  <div class="stage">
    <aside class="side">
      <div class="logo">班表</div>
      <div class="nav"><div class="on">今天</div><div>排班</div><div>打卡记录</div><div>薪水</div></div>

      <svg id="m" viewBox="0 -40 400 460" aria-label="A2 小厨师">
        <ellipse id="shadow" cx="200" cy="398" rx="96" ry="11" fill="rgba(0,0,0,.22)"/>
        <g id="fxBack"></g>
        <g id="rig">
          <!-- feet -->
          <ellipse cx="168" cy="380" rx="29" ry="15" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="6"/>
          <ellipse cx="232" cy="380" rx="29" ry="15" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="6"/>
          <!-- body -->
          <path d="M138,250 C112,258 100,290 100,322 C100,354 120,374 200,374 C280,374 300,354 300,322 C300,290 288,258 262,250 Q200,236 138,250 Z" fill="#fff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
          <path d="M120,300 C140,340 150,356 168,366" fill="none" stroke="#e6e6e6" stroke-width="8" stroke-linecap="round"/>
          <path d="M146,302 L254,302 L257,350 C238,366 162,366 143,350 Z" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
          <circle cx="178" cy="273" r="5" fill="#1a1a1a"/><circle cx="222" cy="273" r="5" fill="#1a1a1a"/>
          <circle cx="178" cy="292" r="5" fill="#1a1a1a"/><circle cx="222" cy="292" r="5" fill="#1a1a1a"/>
          <!-- arms -->
          <g id="armL">
            <path d="M138,254 C112,262 98,282 96,300 L125,304 C127,290 133,278 146,270 Z" fill="#fff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
            <path d="M96,298 L125,302" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
            <circle cx="110" cy="314" r="15" fill="#FCD3A6" stroke="#1a1a1a" stroke-width="6"/>
          </g>
          <g transform="translate(400 0) scale(-1 1)">
            <g id="armR">
              <path d="M138,254 C112,262 98,282 96,300 L125,304 C127,290 133,278 146,270 Z" fill="#fff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round"/>
              <path d="M96,298 L125,302" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
              <circle cx="110" cy="314" r="15" fill="#FCD3A6" stroke="#1a1a1a" stroke-width="6"/>
            </g>
          </g>
          <!-- head -->
          <g id="head">
            <ellipse cx="200" cy="168" rx="80" ry="48" fill="#3a2418" stroke="#1a1a1a" stroke-width="6"/>
            <circle cx="126" cy="194" r="14" fill="#FCD3A6" stroke="#1a1a1a" stroke-width="6"/>
            <circle cx="274" cy="194" r="14" fill="#FCD3A6" stroke="#1a1a1a" stroke-width="6"/>
            <ellipse cx="200" cy="190" rx="72" ry="52" fill="#FCD3A6" stroke="#1a1a1a" stroke-width="6"/>
            <g id="cheeks"><ellipse cx="152" cy="205" rx="17" ry="11" fill="#FF9E9E" opacity=".7"/><ellipse cx="248" cy="205" rx="17" ry="11" fill="#FF9E9E" opacity=".7"/><circle cx="147" cy="202" r="3" fill="#fff" opacity=".8"/><circle cx="243" cy="202" r="3" fill="#fff" opacity=".8"/></g>
            <path id="browL" d="M163,160 Q174,151 185,160" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
            <path id="browR" d="M215,160 Q226,151 237,160" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
            <!-- eyes -->
            <g id="eyesN"><g id="look">
              <g id="eyeL"><ellipse cx="174" cy="180" rx="9" ry="12" fill="#1a1a1a"/><circle cx="171" cy="175" r="3.4" fill="#fff"/></g>
              <g id="eyeR"><ellipse cx="226" cy="180" rx="9" ry="12" fill="#1a1a1a"/><circle cx="223" cy="175" r="3.4" fill="#fff"/></g>
            </g></g>
            <g id="eyesHappy" fill="none" stroke="#1a1a1a" stroke-width="5.5" stroke-linecap="round"><path d="M163,184 Q174,168 185,184"/><path d="M215,184 Q226,168 237,184"/></g>
            <g id="eyesClosed" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"><path d="M164,180 Q174,189 184,180"/><path d="M216,180 Q226,189 236,180"/></g>
            <g id="eyesShock"><circle cx="174" cy="180" r="13" fill="#fff" stroke="#1a1a1a" stroke-width="4.5"/><circle cx="174" cy="181" r="4.5" fill="#1a1a1a"/><circle cx="226" cy="180" r="13" fill="#fff" stroke="#1a1a1a" stroke-width="4.5"/><circle cx="226" cy="181" r="4.5" fill="#1a1a1a"/></g>
            <g id="eyesHalf" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"><path d="M164,180 L184,180 Q174,192 164,180Z"/><path d="M216,180 L236,180 Q226,192 216,180Z"/></g>
            <path d="M195,193 Q200,189 205,193" fill="none" stroke="#E5534B" stroke-width="3" stroke-linecap="round"/>
            <!-- mouths -->
            <g id="mSmile"><path d="M184,205 Q200,228 216,205 Z" fill="#3a1a1a" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/><path d="M192,216 Q200,210 208,216 Q200,223 192,216Z" fill="#FF7B7B"/></g>
            <g id="mBig"><path d="M179,202 Q200,240 221,202 Z" fill="#3a1a1a" stroke="#1a1a1a" stroke-width="4" stroke-linejoin="round"/><path d="M189,220 Q200,211 211,220 Q200,230 189,220Z" fill="#FF7B7B"/></g>
            <path id="mClosed" d="M189,208 Q200,216 211,208" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
            <ellipse id="mO" cx="200" cy="212" rx="7" ry="9" fill="#3a1a1a" stroke="#1a1a1a" stroke-width="3"/>
            <path id="mWavy" d="M187,212 Q193,207 200,212 Q207,217 213,212" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
            <ellipse id="mSleep" cx="200" cy="211" rx="4.5" ry="3.5" fill="#3a1a1a"/>
            <!-- hat -->
            <g id="hat">
              <g fill="#1a1a1a"><circle cx="160" cy="82" r="37"/><circle cx="240" cy="82" r="37"/><circle cx="200" cy="58" r="41"/><rect x="145" y="80" width="110" height="64" rx="8"/></g>
              <g fill="#fff"><circle cx="160" cy="82" r="31"/><circle cx="240" cy="82" r="31"/><circle cx="200" cy="58" r="35"/><rect x="151" y="86" width="98" height="52" rx="4"/></g>
              <path d="M140,92 Q150,108 170,104" fill="none" stroke="#e8e8e8" stroke-width="7" stroke-linecap="round"/>
              <g stroke="#b5b5b5" stroke-width="4" stroke-linecap="round"><path d="M178,104 L180,126"/><path d="M200,102 L200,126"/><path d="M222,104 L220,126"/></g>
            </g>
            <path id="sweat" d="M268,132 Q279,152 268,160 Q257,152 268,132Z" fill="#8FD3FF" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
          </g>
          <!-- neckerchief -->
          <g stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" fill="#E8232A">
            <path d="M200,246 L158,236 L176,270 Z"/><path d="M200,246 L242,236 L224,270 Z"/><circle cx="200" cy="247" r="10"/>
          </g>
        </g>
        <g id="dots" fill="#fff" stroke="#1a1a1a" stroke-width="3.5"><circle cx="300" cy="120" r="6"/><circle cx="322" cy="100" r="8"/><circle cx="348" cy="76" r="10"/></g>
        <g id="fxFront"></g>
      </svg>
      <div class="fps" id="fps">— fps</div>
    </aside>

    <section class="panel">
      <h2>点按钮看动作</h2>
      <div class="btns" id="btns">
        <button data-s="idle">待机</button>
        <button data-s="wave">挥手</button>
        <button data-s="cheer">欢呼</button>
        <button data-s="tired">下班累瘫</button>
        <button data-s="sleep">睡觉</button>
        <button data-s="think">思考/加载</button>
        <button data-s="oops">出错</button>
        <button data-s="payday">发工资</button>
      </div>
      <button class="clock" id="clock">上班打卡</button>
      <ul class="tips">
        <li>点一下小厨师，他会跟你互动</li>
        <li>移动鼠标或手指，他的眼睛会跟着看</li>
        <li>按“上班打卡”他会欢呼，再按一次“下班打卡”他会累瘫</li>
        <li>15 秒不理他，他会自己睡着；点他会被吓醒</li>
        <li>动作切换时会顺顺地过渡，不会跳</li>
      </ul>
    </section>
  </div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const svg = $('m'), rig = $('rig'), head = $('head'), hat = $('hat'), armL = $('armL'), armR = $('armR');
const look = $('look'), eyeL = $('eyeL'), eyeR = $('eyeR'), browL = $('browL'), browR = $('browR');
const shadow = $('shadow'), cheeks = $('cheeks'), sweat = $('sweat'), dots = $('dots');
const fxF = $('fxFront');
const EYES = ['eyesN','eyesHappy','eyesClosed','eyesShock','eyesHalf'];
const MOUTHS = ['mSmile','mBig','mClosed','mO','mWavy','mSleep'];
const show = (list, id) => list.forEach(k => $(k).style.display = k === id ? '' : 'none');
const sin = Math.sin, abs = Math.abs, PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const BASE = {x:0,y:0,sx:1,sy:1,lean:0,headR:0,headY:0,aL:6,aR:6,browY:0,browR:0,sweat:0,dots:0,cheek:.7};

const S = {
  idle:  {eyes:'eyesN', mouth:'mSmile', f:t => ({
    sy:1+.018*sin(t*2.4), sx:1-.01*sin(t*2.4), headR:2.5*sin(t*1.2)+lookC.x*.5, headY:1.2*sin(t*2.4+.6),
    aL:6+3*sin(t*2.4), aR:6+3*sin(t*2.4+.4)})},
  wave:  {dur:2.8, eyes:'eyesHappy', mouth:'mSmile', f:t => ({
    headR:-6+2.5*sin(t*10), lean:-2.5, aR:142+22*sin(t*10), aL:8, sy:1+.02*sin(t*5), browY:-3, cheek:.95})},
  cheer: {dur:2.6, eyes:'eyesHappy', mouth:'mBig', burst:'confetti', f:t => {
    const p = abs(sin(t*5.2)), land = Math.pow(1-p, 6);
    return {y:-48*p, sy:1+.07*p-.14*land, sx:1-.035*p+.12*land, headR:4*sin(t*5.2),
      aL:132+12*sin(t*10.4), aR:132+12*sin(t*10.4+.8), browY:-5, cheek:1};
  }},
  tired: {eyes:'eyesHalf', mouth:'mWavy', f:t => ({
    sy:.95+.012*sin(t*1.4), sx:1.035, headR:9+1.5*sin(t*1.4), headY:7, lean:2, aL:-3, aR:-3,
    browR:14, browY:3, sweat:1, cheek:.3})},
  sleep: {eyes:'eyesClosed', mouth:'mSleep', zzz:true, f:t => ({
    sy:1+.035*sin(t*1.6), sx:1-.02*sin(t*1.6), headR:13+2*sin(t*1.6), headY:8, lean:2, aL:2, aR:2, browY:2, cheek:.9})},
  think: {eyes:'eyesN', mouth:'mClosed', lookAt:{x:4,y:-5}, f:t => ({
    headR:-9+1.5*sin(t*2), headY:-2, aL:8, aR:38+4*sin(t*2), browR:-8, browY:-2, dots:1, sy:1+.012*sin(t*2)})},
  oops:  {dur:2.1, eyes:'eyesShock', mouth:'mO', f:t => {
    const k = Math.exp(-t*2.2);
    return {x:5*sin(t*44)*k, y:-16*Math.exp(-t*7)*(1-Math.exp(-t*30)), sy:1+.06*Math.exp(-t*5), sx:1-.03*Math.exp(-t*5),
      aL:72+6*sin(t*30)*k, aR:72+6*sin(t*30+1)*k, browY:-7, browR:10, sweat:1, headR:-3*sin(t*20)*k};
  }},
  payday:{dur:3.4, eyes:'eyesHappy', mouth:'mBig', coins:true, f:t => {
    const p = abs(sin(t*7));
    return {y:-14*p, sy:1+.03*p-.06*Math.pow(1-p,6), headR:5*sin(t*7),
      aL:122+20*sin(t*14), aR:122+20*sin(t*14+PI), browY:-4, cheek:1};
  }},
};

let cur = 'idle', tS = 0, blend = 1, from = {...BASE};
const P = {...BASE};
let lookT = {x:0,y:0}, lookC = {x:0,y:0};
let blinkIn = 2, blinkT = -1, lastTouch = performance.now();
let hatA = 0, hatV = 0, prevHeadR = 0, prevY = 0;
let parts = [], coinClock = 0, zClock = 0;

function play(name){
  if (!S[name]) return;
  from = {...P}; blend = 0; cur = name; tS = 0; coinClock = 0; zClock = .3;
  const st = S[name];
  show(EYES, st.eyes); show(MOUTHS, st.mouth);
  if (st.burst === 'confetti') confetti();
  document.querySelectorAll('#btns button').forEach(b => b.classList.toggle('on', b.dataset.s === name));
}

// ---- particles ----
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function confetti(){
  const cols = ['#FFC21A','#18B04A','#2B8CFF','#fff','#FF7BD5','#FF8A1F'];
  for (let i = 0; i < 46; i++){
    const g = el('g', {}, fxF);
    el('rect', {x:-5, y:-8, width:10, height:16, rx:2, fill:cols[i % cols.length], stroke:'#1a1a1a', 'stroke-width':2}, g);
    parts.push({el:g, x:200+(Math.random()-.5)*60, y:110, vx:(Math.random()-.5)*520, vy:-260-Math.random()*360,
      r:Math.random()*360, vr:(Math.random()-.5)*720, g:760, life:2.2, max:2.2, spin:Math.random()*10});
  }
}
function coin(){
  const g = el('g', {}, fxF);
  el('circle', {r:13, fill:'#FFC21A', stroke:'#1a1a1a', 'stroke-width':3}, g);
  el('circle', {r:7, fill:'none', stroke:'#C98A00', 'stroke-width':2.5}, g);
  parts.push({el:g, x:70+Math.random()*260, y:-60, vx:(Math.random()-.5)*40, vy:60+Math.random()*80,
    r:0, vr:0, g:620, life:1.6, max:1.6, spin:Math.random()*6, coin:true});
}
function zzz(){
  const t = el('text', {'font-size':26, 'font-weight':900, fill:'#fff', stroke:'#1a1a1a', 'stroke-width':2.5, 'paint-order':'stroke',
    'font-family':'system-ui,sans-serif', 'text-anchor':'middle'}, fxF);
  t.textContent = 'Z';
  parts.push({el:t, x:278, y:118, vx:28, vy:-42, r:-10, vr:10, g:0, life:2.6, max:2.6, z:true, ph:Math.random()*6});
}
function stepParts(dt){
  parts = parts.filter(p => {
    p.life -= dt;
    if (p.life <= 0){ p.el.remove(); return false; }
    p.vy += p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.r += p.vr*dt; p.spin += dt*9;
    if (p.coin && p.y > 360){ p.y = 360; p.vy *= -.35; p.vx *= .6; }
    const age = 1 - p.life/p.max;
    let tr = `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.r.toFixed(1)})`;
    if (p.z){ const s = .6 + age*.9; tr = `translate(${(p.x + 8*sin(age*8+p.ph)).toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.r.toFixed(1)}) scale(${s.toFixed(2)})`; p.el.setAttribute('opacity', (age < .15 ? age/.15 : p.life/p.max*1.2).toFixed(2)); }
    else if (p.coin) tr += ` scale(${Math.cos(p.spin).toFixed(2)} 1)`;
    else tr += ` scale(${Math.cos(p.spin).toFixed(2)} 1)`;
    if (!p.z && p.life < .4) p.el.setAttribute('opacity', (p.life/.4).toFixed(2));
    p.el.setAttribute('transform', tr);
    return true;
  });
}

// ---- input ----
function wake(){ lastTouch = performance.now(); }
addEventListener('pointermove', e => {
  const r = svg.getBoundingClientRect();
  const cx = r.left + r.width/2, cy = r.top + r.height*.38;
  lookT.x = clamp((e.clientX - cx)/r.width*14, -5, 5);
  lookT.y = clamp((e.clientY - cy)/r.height*12, -3.5, 3.5);
  wake();
}, {passive:true});
let tapN = 0;
svg.addEventListener('click', () => {
  const was = cur; wake();
  if (was === 'sleep') return play('oops');
  play(['wave','cheer','payday'][tapN++ % 3]);
});
document.querySelectorAll('#btns button').forEach(b => b.addEventListener('click', () => { wake(); play(b.dataset.s); }));
let clockedIn = false;
$('clock').addEventListener('click', e => {
  wake(); clockedIn = !clockedIn;
  e.currentTarget.textContent = clockedIn ? '下班打卡' : '上班打卡';
  e.currentTarget.classList.toggle('out', clockedIn);
  play(clockedIn ? 'cheer' : 'tired');
});

// ---- loop ----
let last = performance.now(), fN = 0, fT = 0;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  fN++; fT += dt; if (fT >= .5){ $('fps').textContent = Math.round(fN/fT) + ' fps'; fN = 0; fT = 0; }
  tS += dt; blend += dt;
  const st = S[cur];
  if (st.dur && tS > st.dur) play('idle');
  if (cur === 'idle' && now - lastTouch > 15000) play('sleep');

  // eyes follow
  const lt = st.lookAt || (cur === 'sleep' ? {x:0,y:0} : lookT);
  const kL = 1 - Math.exp(-dt*10);
  lookC.x += (lt.x - lookC.x)*kL; lookC.y += (lt.y - lookC.y)*kL;

  // pose with smooth blend between actions
  const T = Object.assign({}, BASE, S[cur].f(tS));
  const k = Math.min(1, blend/.4), e = 1 - Math.pow(1-k, 3);
  for (const key in BASE) P[key] = from[key] + (T[key] - from[key])*e;

  // blinking
  let bs = 1;
  if (S[cur].eyes === 'eyesN'){
    blinkIn -= dt;
    if (blinkIn <= 0 && blinkT < 0){ blinkT = 0; blinkIn = 2 + Math.random()*3.5; if (Math.random() < .2) blinkIn = .28; }
    if (blinkT >= 0){ blinkT += dt; bs = 1 - sin(Math.min(1, blinkT/.16)*PI)*.92; if (blinkT > .16) blinkT = -1; }
  }

  // hat lags behind head (secondary motion)
  const wHead = (P.headR - prevHeadR)/Math.max(dt, .001), vy = (P.y - prevY)/Math.max(dt, .001);
  prevHeadR = P.headR; prevY = P.y;
  const hatTarget = clamp(-wHead*.09 + P.x*.6, -14, 14);
  hatV += ((hatTarget - hatA)*240 - hatV*13)*dt; hatA += hatV*dt;
  const hatSy = 1 + clamp(vy*.00035, -.07, .07);

  // render
  rig.setAttribute('transform', `translate(${(200+P.x).toFixed(2)} ${(392+P.y).toFixed(2)}) rotate(${P.lean.toFixed(2)}) scale(${P.sx.toFixed(4)} ${P.sy.toFixed(4)}) translate(-200 -392)`);
  const ss = clamp(1 + P.y/140, .5, 1.1);
  shadow.setAttribute('transform', `translate(200 398) scale(${ss.toFixed(3)} 1) translate(-200 -398)`);
  shadow.setAttribute('opacity', (.4 + .6*ss).toFixed(2));
  head.setAttribute('transform', `translate(0 ${P.headY.toFixed(2)}) rotate(${P.headR.toFixed(2)} 200 240)`);
  hat.setAttribute('transform', `translate(200 138) rotate(${hatA.toFixed(2)}) scale(1 ${hatSy.toFixed(3)}) translate(-200 -138)`);
  const armT = a => `translate(130 262) rotate(${a.toFixed(2)}) scale(${(1 + clamp((a-50)/90, 0, 1)*.28).toFixed(3)}) translate(-130 -262)`;
  armL.setAttribute('transform', armT(P.aL));
  armR.setAttribute('transform', armT(P.aR));
  look.setAttribute('transform', `translate(${lookC.x.toFixed(2)} ${lookC.y.toFixed(2)})`);
  eyeL.setAttribute('transform', `translate(174 180) scale(1 ${bs.toFixed(3)}) translate(-174 -180)`);
  eyeR.setAttribute('transform', `translate(226 180) scale(1 ${bs.toFixed(3)}) translate(-226 -180)`);
  browL.setAttribute('transform', `translate(0 ${P.browY.toFixed(2)}) rotate(${(-P.browR).toFixed(2)} 174 156)`);
  browR.setAttribute('transform', `translate(0 ${P.browY.toFixed(2)}) rotate(${P.browR.toFixed(2)} 226 156)`);
  cheeks.setAttribute('opacity', P.cheek.toFixed(2));
  sweat.setAttribute('opacity', P.sweat.toFixed(2));
  sweat.setAttribute('transform', `translate(0 ${(((tS*14) % 14)).toFixed(1)})`);
  dots.setAttribute('opacity', P.dots.toFixed(2));
  [...dots.children].forEach((c, i) => c.setAttribute('transform', `translate(0 ${(-4*Math.max(0, sin(tS*5 - i*.9))).toFixed(2)})`));

  // effects
  if (S[cur].coins && tS < 2.6){ coinClock -= dt; if (coinClock <= 0){ coin(); coinClock = .09; } }
  if (S[cur].zzz){ zClock -= dt; if (zClock <= 0){ zzz(); zClock = 1.1; } }
  stepParts(dt);

  requestAnimationFrame(frame);
}
play('idle');
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
