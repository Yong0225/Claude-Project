<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A2 视频抠图 Demo</title>
<style>
:root{--red:#E8232A;--red-d:#B5121A;--ink:#1a1a1a;--bg:#FFF4EC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 48px}
h1{font-size:24px;margin:0 0 4px;font-weight:900}
.sub{margin:0 0 16px;color:#7a625a;font-size:14px;line-height:1.5}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{border-radius:30px;border:3px solid var(--ink);padding:18px;position:relative;overflow:hidden;min-height:420px;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;opacity:.55}
.red{background:var(--red);color:#fff}.red::before{background:var(--red-d)}
.cream{background:#fff;color:var(--ink)}.cream::before{background:#FFE7DA}
.lbl{font-weight:900;font-size:18px;position:relative}
.card img{margin-top:auto;width:100%;max-width:300px;align-self:center;display:block;position:relative}
@media (max-width:720px){.row{grid-template-columns:1fr}.card{min-height:0}.card img{max-width:240px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>A2 小厨师 · AI 视频抠图版</h1>
  <p class="sub">用 Kling 生成的挥手视频，去掉白底后变成透明动画（每秒 24 帧），可以直接放在任何颜色上。</p>
  <div class="row">
    <div class="card red"><div class="lbl">放在红色侧边栏上</div><img src="animations/A2-cutout-wave.webp" alt="A2 挥手"></div>
    <div class="card cream"><div class="lbl">放在白色卡片上</div><img src="animations/A2-cutout-wave.webp" alt="A2 挥手"></div>
  </div>
</div>
</body>
</html>
