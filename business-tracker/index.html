<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Pulse — Business Metrics</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --elev:#fff; --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --sep:rgba(60,60,67,.13); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.07);
  --thumb:#fff; --bar:rgba(245,245,247,.74); --side:rgba(236,236,240,.72);
  --blue:#0071e3; --green:#28a745; --green-t:#34c759; --red:#ff3b30; --orange:#ff9500;
  --purple:#af52de; --indigo:#5856d6; --teal:#30b0c7; --pink:#ff2d55;
  --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 18px rgba(0,0,0,.045);
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --elev:#2c2c2e; --text:#f5f5f7; --text2:#98989d; --text3:#636366;
  --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
  --thumb:#636366; --bar:rgba(22,22,23,.74); --side:rgba(28,28,30,.7);
  --blue:#0a84ff; --green:#30d158; --green-t:#30d158; --red:#ff453a; --orange:#ff9f0a;
  --purple:#bf5af2; --indigo:#5e5ce6; --teal:#40c8e0; --pink:#ff375f;
  --shadow:none; color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --elev:#2c2c2e; --text:#f5f5f7; --text2:#98989d; --text3:#636366;
    --sep:rgba(84,84,88,.5); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.14);
    --thumb:#636366; --bar:rgba(22,22,23,.74); --side:rgba(28,28,30,.7);
    --blue:#0a84ff; --green:#30d158; --green-t:#30d158; --red:#ff453a; --orange:#ff9f0a;
    --purple:#bf5af2; --indigo:#5e5ce6; --teal:#40c8e0; --pink:#ff375f;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);
  font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",system-ui,"Microsoft YaHei",sans-serif;
  letter-spacing:-.022em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background-color .4s ease,color .4s ease}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
.num,.tab{font-variant-numeric:tabular-nums}
svg{display:block}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;width:248px;flex:none;padding:22px 12px;display:flex;flex-direction:column;gap:2px;
  background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:.5px solid var(--sep);z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#5ac8fa,#0071e3 55%,#5856d6);box-shadow:0 2px 6px rgba(0,113,227,.35)}
.brand small{display:block;font-size:12px;font-weight:500;color:var(--text2);letter-spacing:0;margin-top:-2px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;
  font-size:15px;font-weight:500;text-align:left;color:var(--text);transition:background-color .2s ease,transform .12s var(--ease)}
.nav svg{width:20px;height:20px;color:var(--blue);flex:none}
.nav:hover{background:var(--fill2)}
.nav:active{transform:scale(.98)}
.nav.on{background:var(--fill)}
.side .grow{flex:1}
.langsw{margin:0 6px 4px}

.main{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-left));
  padding-top:env(safe-area-inset-top);box-sizing:content-box;
  transition:background-color .3s ease,box-shadow .3s ease,-webkit-backdrop-filter .3s,backdrop-filter .3s}
.topbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.topbar .tt{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;pointer-events:none;
  opacity:0;transform:translateY(6px);transition:opacity .25s ease,transform .35s var(--ease)}
.topbar.scrolled .tt{opacity:1;transform:none}
.topbar .sp{flex:1}
.iconbtn{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;border:0;display:grid;place-items:center;
  background:var(--fill);color:var(--blue);transition:transform .15s var(--ease),background-color .2s}
.iconbtn:active{transform:scale(.9);background:var(--fill)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.primary{background:var(--blue);color:#fff}
.pill{position:relative;z-index:1;border:0;background:var(--fill);color:var(--text);border-radius:99px;height:32px;padding:0 12px;
  font-size:14px;font-weight:600;transition:transform .15s var(--ease)}
.pill:active{transform:scale(.94)}
/* names you can tap to rename — no extra button */
.ename{border-radius:6px;padding:0 3px;margin:0 -3px;cursor:text;outline:none;transition:background-color .2s ease,box-shadow .2s ease;-webkit-user-select:text;user-select:text}
.ename:hover{background:var(--fill2)}
.ename:focus{background:var(--fill);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 35%,transparent);text-overflow:clip}
.row.tap{cursor:pointer}
.mview{margin:0 0 14px}
.vtag{display:inline-block;font-size:11px;font-weight:600;color:var(--purple);background:color-mix(in srgb,var(--purple) 12%,transparent);border-radius:99px;padding:0 6px;margin-right:6px;letter-spacing:0;vertical-align:1px}
/* A/B test comparison */
.test .tt1{font-size:17px;letter-spacing:-.02em}
.tscroll{overflow-x:auto;margin:10px -4px 0;padding:0 4px}
.ttable{width:100%;border-collapse:collapse}
.ttable th{font-size:13px;font-weight:600;color:var(--text2);text-align:right;padding:6px 8px;white-space:nowrap;letter-spacing:-.005em}
.ttable th:first-child,.ttable td:first-child{text-align:left;padding-left:0}
.ttable td{padding:10px 8px;text-align:right;vertical-align:top;box-shadow:0 -.5px 0 var(--sep) inset;box-shadow:none;border-top:.5px solid var(--sep)}
.ttable td:first-child{font-size:15px;min-width:118px;letter-spacing:-.015em}
.ttable tr.tn td{font-size:13px;border-top:0;padding-top:4px;padding-bottom:6px}
.ttable .tv{font-size:16px;font-weight:600;letter-spacing:-.015em}
.ttable .tsub{font-size:11px;color:var(--text3);letter-spacing:0}
.ttable td.best .tv{color:var(--blue)}
.ttable .tbar{display:block;height:3px;border-radius:2px;background:var(--fill);margin:5px 0 0 auto;width:56px;position:relative;overflow:hidden;color:var(--text3)}
.ttable .tbar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--w);background:currentColor;border-radius:2px;transition:width .6s var(--ease)}
.ttable td.best .tbar{color:var(--blue)}
.tbadge{display:inline-block;margin-top:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--fill2);color:var(--text2);letter-spacing:0;white-space:nowrap}
.tbadge.sig{color:var(--green);background:color-mix(in srgb,var(--green-t) 15%,transparent)}
.tbadge.small{color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,transparent)}
#syncBtn{color:var(--text2)}
#syncBtn i{position:absolute;right:4px;bottom:5px;width:9px;height:9px;border-radius:50%;background:var(--text3);box-shadow:0 0 0 2px var(--bg);transition:background-color .3s ease}
#syncBtn[data-s="idle"] i{background:var(--green-t)}
#syncBtn[data-s="syncing"] i,#syncBtn[data-s="pending"] i{background:var(--blue);animation:syncpulse 1.1s ease-in-out infinite}
#syncBtn[data-s="error"] i{background:var(--red)}
@keyframes syncpulse{50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){ #syncBtn i{animation:none!important} }
.paircode{font:700 38px/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;padding:16px 0 6px;transition:opacity .25s ease}

/* ---------- Hormozi mode: coach, Rule of 100, rules ---------- */
:root{--bubble:#f2f2f7}
:root[data-theme="dark"]{--bubble:#2c2c2e}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--bubble:#2c2c2e} }
.sheet .coach .bubble{background:var(--card)}
:root[data-theme="dark"] .sheet .coach .bubble{background:#2c2c2e}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sheet .coach .bubble{background:#2c2c2e} }
.coach{display:flex;gap:12px;align-items:flex-start}
.hz-avbtn{border:0;background:none;padding:0;border-radius:50%;flex:none;transition:transform .18s var(--ease)}
.hz-avbtn:active{transform:scale(.9)}
.hz-avw{display:block;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.hz-av{width:100%;height:100%}
.hz-av .eyes{transform-box:fill-box;transform-origin:center;animation:hzblink 4.8s infinite}
@keyframes hzblink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.12)}}
.hz-av .mouth{transform-box:fill-box;transform-origin:center;transform:scaleY(.45)}
.talking .hz-av .mouth{animation:hztalk .15s ease-in-out infinite alternate}
@keyframes hztalk{from{transform:scaleY(.35)}to{transform:scaleY(1.5)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--bubble);border-radius:18px;padding:9px 14px 11px;margin-top:3px;transform-origin:0 22px}
.bubble[data-act]{cursor:pointer}
.bubble::before{content:"";position:absolute;left:-5px;top:17px;width:13px;height:13px;background:inherit;border-radius:2px;transform:rotate(45deg)}
.bubble .bn{position:relative;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:0;margin-bottom:2px}
.bubble .btw{position:relative;display:grid}
.bubble .btw>span{grid-area:1/1;font-size:15.5px;line-height:1.45;letter-spacing:-.012em}
.bubble .bt-ghost{visibility:hidden}
.bubble .bsrc{position:relative;font-size:12px;color:var(--text3);margin-top:4px;letter-spacing:0}
.bubble .bsrc:empty{display:none}
.mbn{display:flex;align-items:center;gap:6px;margin:14px 0 0 68px;flex-wrap:wrap}
.mbn span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--fill2);color:var(--text3);letter-spacing:0;transition:background-color .3s ease,color .3s ease}
.mbn span.past{color:var(--text2)}
.mbn span.on{background:var(--blue);color:#fff}
.mbn i{width:10px;height:1.5px;background:var(--sep);border-radius:1px}
.mbn .sp{flex:1}
.hz-dots{display:flex;gap:5px}
.hz-dots i{width:6px;height:6px;border-radius:50%;background:var(--fill);transition:background-color .25s ease,transform .3s var(--ease)}
.hz-dots i.on{background:var(--text2);transform:scale(1.2)}
@media (max-width:420px){ .mbn{margin-left:0} }
.r100 .h3{font-size:17px;letter-spacing:-.02em}
.r100main{display:flex;align-items:center;gap:16px;margin:12px 0 14px}
.r100main .bd,.r100mini .bd{flex:1;min-width:0}
.r100main .t1{font-size:17px;letter-spacing:-.02em}
.r100main .t2{font-size:13px;color:var(--text2);margin-top:2px}
.r100 .ring .rt,.r100 .ring .rf{stroke-width:8}
.r100 .ring span{font-size:24px;letter-spacing:-.03em}
.r100plus{height:40px;padding:0 15px 0 12px;border-radius:99px;gap:3px;flex:none}
.r100grid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px}
.r100grid i{aspect-ratio:1;border-radius:3px;background:var(--fill2);transition:background-color .4s ease}
.r100grid i.part{background:color-mix(in srgb,var(--green-t) var(--p),var(--fill2))}
.r100grid i.hit{background:var(--green-t)}
.r100grid i.off{opacity:.4}
.r100grid i.td{box-shadow:0 0 0 1.5px var(--text2)}
.r100mini{display:flex;align-items:center;gap:12px;background:var(--fill2);border-radius:14px;padding:8px 12px;margin:0 0 10px}
.r100mini .ring .rt,.r100mini .ring .rf{stroke-width:9}
.r100mini .t1{font-size:15px;letter-spacing:-.015em}
.r100mini .t2{font-size:12px;color:var(--text2);letter-spacing:-.005em}
.hzrule{cursor:pointer}
.hzrule .q{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.35;margin:0 0 8px}
.toast.coach-toast{border-radius:22px;padding:8px 18px 8px 8px;gap:12px;line-height:1.35}
.sw{position:relative;flex:none;width:51px;height:31px}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--fill);transition:background-color .25s ease}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:transform .38s cubic-bezier(.3,1.35,.5,1)}
.sw input:checked+i{background:var(--green-t)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 40%,transparent)}
@media (prefers-reduced-motion:reduce){ .hz-av .eyes,.talking .hz-av .mouth{animation:none} }

.page{max-width:1100px;margin:0 auto;padding:0 max(20px,env(safe-area-inset-left)) calc(110px + env(safe-area-inset-bottom))}
.lt{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:2px 0 2px}
.sub{color:var(--text2);font-size:15px;margin:0 0 20px;letter-spacing:-.01em}
.h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:34px 0 12px;display:flex;align-items:baseline;gap:10px}
.h2 .sp{flex:1}
.h2 a,.link{font-size:15px;font-weight:500;color:var(--blue);cursor:pointer;border:0;background:none;padding:0;letter-spacing:-.01em}
.muted{color:var(--text2)}
.small{font-size:13px;letter-spacing:-.005em}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;font-weight:600;letter-spacing:.01em;color:var(--text3);padding:2px 0;transition:color .2s ease}
.tabbar button svg{width:25px;height:25px;transition:transform .3s var(--ease)}
.tabbar button:active svg{transform:scale(.86)}
.tabbar button.on{color:var(--blue)}
@media (min-width:900px){ .tabbar{display:none} .page{padding-bottom:60px} .topbar{padding-left:28px;padding-right:28px} .page{padding-left:28px;padding-right:28px} }
@media (max-width:899px){ .side{display:none} .lt{font-size:32px} }

/* ---------- surfaces ---------- */
.card{background:var(--card);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow)}
.press{transition:transform .18s var(--ease)}
.press:active{transform:scale(.975)}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:720px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} .two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} }
.kpi{cursor:pointer;position:relative;overflow:hidden;min-height:128px;display:flex;flex-direction:column}
.kpi .lb{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:-.005em;display:flex;align-items:center;gap:6px}
.kpi .lb i{width:8px;height:8px;border-radius:50%;flex:none}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.kpi .spark{width:64px;height:26px;flex:none}
@media (max-width:420px){ .kpi .v{font-size:25px} .kpi .spark{width:48px} .card{padding:16px} }
.d{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap;letter-spacing:0;
  color:var(--text2);background:var(--fill2)}
.d.good{color:var(--green);background:color-mix(in srgb,var(--green-t) 15%,transparent)}
.d.bad{color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.d svg{width:10px;height:10px}

/* segmented */
.seg{position:relative;display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;max-width:100%;touch-action:manipulation}
.seg button{position:relative;z-index:1;flex:1 1 0;border:0;background:none;font-size:13px;font-weight:500;letter-spacing:-.005em;
  padding:6px 14px;border-radius:7px;white-space:nowrap;transition:opacity .2s ease;min-width:0}
.seg button.on{font-weight:600}
.seg button:active{opacity:.55}
.seg .th{position:absolute;top:2px;bottom:2px;left:0;width:0;border-radius:7px;background:var(--thumb);
  box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);will-change:transform,width}
.seg.full{display:flex;width:100%}

.periodbar{display:flex;flex-direction:column;gap:12px;margin:0 0 18px}
.periodnav{display:flex;align-items:center;gap:6px}
.periodnav .lab{font-size:17px;font-weight:600;letter-spacing:-.02em;min-width:0}
.periodnav .cmp{font-size:13px;color:var(--text2)}
.periodnav .sp{flex:1}
.chev{width:32px;height:32px;border-radius:50%;border:0;background:var(--fill2);color:var(--blue);display:grid;place-items:center;
  transition:transform .15s var(--ease),opacity .2s}
.chev:active{transform:scale(.88)}
.chev:disabled{opacity:.3;pointer-events:none}
.chev svg{width:16px;height:16px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;background:var(--fill2);color:var(--text);
  transition:background-color .25s ease,color .25s ease,transform .15s var(--ease)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--text);color:var(--bg)}

/* chart */
.chart{position:relative;height:220px;margin-top:14px;touch-action:pan-y}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .ax{font-size:11px;fill:var(--text3);letter-spacing:0}
.chart .gl{stroke:var(--sep);stroke-width:1}
.chart .ln{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .cur{stroke:var(--text3);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.chart .dot{opacity:0;transition:opacity .15s}
.chart.scrub .cur,.chart.scrub .dot{opacity:1}
.tip{position:absolute;top:-6px;left:0;pointer-events:none;background:var(--elev);border-radius:10px;padding:6px 10px;font-size:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);white-space:nowrap;opacity:0;transform:translateY(4px) scale(.96);
  transition:opacity .15s ease,transform .25s var(--ease);letter-spacing:0}
.chart.scrub .tip{opacity:1;transform:none}
.tip b{display:block;font-size:15px;letter-spacing:-.01em}
.empty-chart{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:14px}

/* funnel */
.fn{display:flex;flex-direction:column}
.fn-row{padding:6px 0}
.fn-top{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;margin-bottom:6px}
.fn-top b{font-weight:600}
.fn-track{height:10px;border-radius:6px;background:var(--fill2);overflow:hidden}
.fn-fill{height:100%;width:0;border-radius:6px;transform-origin:left}
.fn-conv{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:4px 0 0 2px;font-weight:500;letter-spacing:0}
.fn-conv svg{width:11px;height:11px}

/* grouped list */
.list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 16px;position:relative;width:100%;border:0;background:none;text-align:left;
  transition:background-color .25s ease}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.ind+.row.ind::before{left:58px}
button.row:active,.row.tap:active{background:var(--fill2);transition:none}
.row .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.row .ic svg{width:18px;height:18px}
.row .bd{flex:1;min-width:0}
.row .t1{font-size:16px;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.005em}
.row .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row .rv{font-size:16px;font-weight:600;letter-spacing:-.015em}
.row .cv{color:var(--text3);width:8px;flex:none}
.row input.inl,.row select.inl{border:0;background:none;text-align:right;outline:none;min-width:0;width:100%;font-size:16px;color:var(--text);padding:6px 0}
.row select.inl{direction:rtl;appearance:none;-webkit-appearance:none;color:var(--text2);cursor:pointer}
.row input.inl::placeholder{color:var(--text3)}
.row .lbl{flex:none;font-size:16px;letter-spacing:-.015em}
.row .unit{color:var(--text3);font-size:16px;flex:none}
.gh{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.02em;margin:26px 16px 7px;font-weight:500}
.gf{font-size:13px;color:var(--text2);margin:7px 16px 0;line-height:1.4;letter-spacing:-.005em}
.danger{color:var(--red)!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 18px;height:44px;
  font-size:16px;font-weight:600;background:var(--blue);color:#fff;transition:transform .18s var(--ease),filter .2s,opacity .2s}
.btn:active{transform:scale(.97);filter:brightness(.92)}
.btn.sec{background:var(--fill);color:var(--blue)}
.btn.block{display:flex;width:100%}
.btn svg{width:18px;height:18px}

/* today counter */
.today-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.today-head .lab{flex:1;text-align:center;font-weight:600;font-size:16px}
.ctr{display:flex;align-items:center;gap:12px;padding:10px 0}
.ctr+.ctr{box-shadow:0 -.5px 0 var(--sep)}
.ctr .nm{flex:1;min-width:0;font-size:16px}
.ctr .nm small{display:block;font-size:12px;color:var(--text2)}
.step{width:38px;height:38px;border-radius:50%;border:0;background:var(--fill2);color:var(--blue);display:grid;place-items:center;flex:none;
  transition:transform .15s var(--ease),background-color .2s}
.step:active{transform:scale(.86);background:var(--fill)}
.step svg{width:18px;height:18px}
.ctr .val{width:64px;text-align:center;font-size:22px;font-weight:600;letter-spacing:-.02em;border:0;background:none;outline:none;padding:0;border-radius:8px;display:inline-block}
.ctr .val:focus{background:var(--fill2)}
.bump{animation:bump .42s var(--ease)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.22)}100%{transform:scale(1)}}

/* goals */
.goal{display:flex;align-items:center;gap:16px;cursor:pointer}
.ring{width:66px;height:66px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:var(--fill);stroke-width:7}
.ring .rf{fill:none;stroke-width:7;stroke-linecap:round}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.01em}
.goal .bd{flex:1;min-width:0}
.goal .t1{font-size:16px;font-weight:600;letter-spacing:-.015em}
.goal .t2{font-size:14px;color:var(--text2);margin-top:1px}
.goal .t3{font-size:12px;font-weight:600;margin-top:5px;letter-spacing:0}
.gg{grid-template-columns:1fr}
@media (min-width:720px){ .gg{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* insights */
.ins{display:flex;gap:12px;padding:10px 0;align-items:flex-start;font-size:15px;line-height:1.4}
.ins+.ins{box-shadow:0 -.5px 0 var(--sep)}
.ins i{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:-1px}
.ins i svg{width:14px;height:14px}

/* empty */
.hero-empty{text-align:center;padding:48px 24px 40px}
.hero-empty .big{width:84px;height:84px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(145deg,#5ac8fa,#0071e3 55%,#5856d6);box-shadow:0 10px 30px rgba(0,113,227,.3)}
.hero-empty .big svg{width:44px;height:44px;color:#fff}
.hero-empty h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.hero-empty p{color:var(--text2);margin:0 auto 22px;max-width:380px;font-size:15px}
.hero-empty .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* sheet */
.layer{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;pointer-events:auto}
.sheet{position:relative;pointer-events:auto;width:100%;max-height:calc(100dvh - 44px);background:var(--bg);border-radius:14px 14px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.18);will-change:transform;overflow:hidden}
:root[data-theme="dark"] .sheet{background:#1c1c1e}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sheet{background:#1c1c1e} }
:root[data-theme="dark"] .sheet .list,:root[data-theme="dark"] .sheet .card{background:#2c2c2e}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .sheet .list,:root:not([data-theme="light"]) .sheet .card{background:#2c2c2e} }
.sheet .grab{height:22px;flex:none;display:grid;place-items:center;touch-action:none}
.sheet .grab::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--text3);opacity:.5}
.sheet .sh{display:flex;align-items:center;padding:0 8px 8px;flex:none;touch-action:none}
.sheet .sh h3{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.sheet .sh .link{min-width:84px;padding:8px;font-size:17px}
.sheet .sh .link:first-child{text-align:left}
.sheet .sh .link:last-child{text-align:right;font-weight:600}
.sheet .link:disabled{opacity:.35}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:720px){
  .layer{align-items:center}
  .sheet{width:560px;max-height:min(760px,calc(100dvh - 80px));border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.28)}
  .sheet .grab{height:14px}.sheet .grab::before{display:none}
  .sheet .sb{padding-bottom:24px}
}
.bigval{text-align:center;padding:10px 0 4px}
.bigval .v{font-size:48px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.bigval .d{margin-top:8px}
.formula{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;background:var(--fill2);border-radius:10px;padding:10px 12px;
  letter-spacing:0;line-height:1.6;color:var(--text);overflow-x:auto;white-space:nowrap}
.note{font-size:14px;color:var(--text2);line-height:1.5;margin:10px 4px 0}

/* toast */
.toastwrap{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:200;display:flex;justify-content:center;pointer-events:none}
@media (min-width:900px){ .toastwrap{bottom:28px;padding-left:248px} }
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:11px 12px 11px 18px;border-radius:99px;font-size:15px;font-weight:500;
  background:rgba(30,30,32,.9);color:#fff;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;max-width:calc(100vw - 32px)}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:600}
.toast:not(:has(button)){padding-right:18px}

/* view transitions */
.view{will-change:opacity,transform}
/* enter choreography only plays on a tab switch, never on in-place re-renders */
.entering .rise{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
.entering .spk{animation:draw 1.1s var(--ease) both;animation-delay:.25s}
@keyframes draw{from{stroke-dasharray:1;stroke-dashoffset:1}to{stroke-dasharray:1;stroke-dashoffset:0}}
@media (min-width:1000px){ .metrics-cols{columns:2;column-gap:28px} .metrics-cols>div{break-inside:avoid;padding-top:1px} }

.hint{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--text2);background:var(--fill2);border-radius:12px;padding:10px 12px;margin:12px 0 0;line-height:1.4}
.hint svg{width:16px;height:16px;flex:none;color:var(--blue)}
.kbd{font-family:inherit;font-size:12px;border:.5px solid var(--sep);border-radius:5px;padding:0 5px;color:var(--text2)}
.srow{display:flex;gap:10px;align-items:center}
.srow .sp{flex:1}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  .rise,.bump{animation:none}
  *{scroll-behavior:auto}
}
@media (prefers-reduced-transparency:reduce){
  .topbar.scrolled,.tabbar,.side{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
  .toast{background:#1d1d1f}
}
@media (prefers-contrast:more){
  :root{--sep:rgba(0,0,0,.35);--text2:#3a3a3c}
  .card,.list{box-shadow:0 0 0 1px var(--sep)}
}
</style>
</head>

</div>

function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.en[key] ?? key;

const LSKEY = 'pulse.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fin = v => typeof v === 'number' && isFinite(v);
const div = (a, b) => (b ? a / b : null);
const parseNum = s => { const n = parseFloat(String(s ?? '').replace(/[,\s]/g, '')); return isFinite(n) ? n : 0; };

const MONEY_FIELDS = ['revNew', 'revRec', 'mkt', 'sales', 'cogs', 'opex'];
const DEFAULT_STAGES = ['leads', 'contacted', 'opened', 'replied', 'meeting', 'proposal', 'won'];
const DATA_FV = 2;   // data format version; the server refuses pushes from pages that write an older one
/* one entry per day per test variant ("t"); untagged entries keep the plain date as their key */
const entryKey = e => e.t ? e.date + '|' + e.t : e.date;
const byEntry = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.t || '') < (b.t || '') ? -1 : (a.t || '') > (b.t || '') ? 1 : 0;
const PERIODS = ['week', 'month', 'quarter', 'year', 'all'];

function defaultDB() {
  return {
    v: 1,
    // hz* = Hormozi mode (on unless turned off), r100 = Rule of 100 daily target; old pages keep unknown settings keys
    settings: { lang: null, currency: '$', theme: 'auto', biz: '', startCust: 0, lifeCap: 36, hz: true, r100: 100, r100Stage: '', r100Wknd: true },
    stages: DEFAULT_STAGES.map(id => ({ id })),
    entries: [], goals: [], custom: [], tests: [], names: {},
    fv: DATA_FV, su: 0, setu: 0, nu: 0, del: { e: {}, g: {}, c: {}, t: {} }
  };
}
let DB = defaultDB();

function cleanVals(v) {
  const o = {};
  if (v && typeof v === 'object') for (const k in v) { const n = +v[k]; if (isFinite(n) && n !== 0) o[k] = n; }
  return o;
}
function normalize(d) {
  if (!d || typeof d !== 'object' || !Array.isArray(d.entries)) throw new Error('invalid');
  const base = defaultDB();
  const stages = Array.isArray(d.stages) ? d.stages.filter(s => s && s.id).map(s => ({ id: String(s.id), ...(s.label ? { label: String(s.label) } : {}) })) : [];
  const byKey = new Map();
  for (const e of d.entries) {
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) continue;
    const vals = cleanVals(e.v);
    const rec = { id: String(e.id || uid()), date: e.date, v: vals, note: e.note ? String(e.note) : '', u: +e.u || 0, ...(e.t ? { t: String(e.t) } : {}) };
    const prev = byKey.get(entryKey(rec));
    if (prev) { for (const k in vals) prev.v[k] = (prev.v[k] || 0) + vals[k]; if (rec.note) prev.note = [prev.note, rec.note].filter(Boolean).join(' · '); }
    else byKey.set(entryKey(rec), rec);
  }
  const names = {};
  if (d.names && typeof d.names === 'object') for (const k in d.names) { const s = String(d.names[k] || '').trim().slice(0, 60); if (s) names[k] = s; }
  return {
    v: 1, fv: DATA_FV,
    settings: { ...base.settings, ...(d.settings || {}) },
    stages: stages.length >= 2 ? stages : base.stages,
    entries: [...byKey.values()].sort(byEntry),
    su: +d.su || 0, setu: +d.setu || 0, nu: +d.nu || 0, del: cleanDel(d.del), names,
    tests: (d.tests || []).filter(x => x && x.id && Array.isArray(x.variants)).map(x => ({
      id: String(x.id), name: String(x.name || ''), u: +x.u || 0,
      variants: x.variants.filter(v => v && v.id).map(v => ({ id: String(v.id), name: String(v.name || '') }))
    })),
    goals: (d.goals || []).filter(g => g && g.metric).map(g => ({
      id: String(g.id || uid()), metric: String(g.metric), u: +g.u || 0,
      period: ['week', 'month', 'quarter', 'year'].includes(g.period) ? g.period : 'month', target: +g.target || 0
    })),
    custom: (d.custom || []).filter(c => c && c.a && c.b).map(c => ({
      id: String(c.id || uid()), name: String(c.name || ''), a: String(c.a), b: String(c.b), u: +c.u || 0,
      fmt: ['num', 'money', 'pct', 'ratio'].includes(c.fmt) ? c.fmt : 'num', better: c.better === 'down' ? 'down' : 'up'
    }))
  };
}
function load() {
  try { const raw = localStorage.getItem(LSKEY); if (raw) DB = normalize(JSON.parse(raw)); } catch (e) { }
  snapshot();
}
function save() { try { localStorage.setItem(LSKEY, JSON.stringify(DB)); } catch (e) { } }
/* every data mutation goes through commit(): sort, drop caches, stamp what changed (for sync),
   persist locally, then queue a cloud push */
function commit() {
  DB.entries.sort(byEntry);
  ctxCache.clear();
  stamp();
  save();
  Sync.dirty();
}

/* ---- dates (local calendar days as YYYY-MM-DD strings) ---- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const loc = () => LANG === 'zh' ? 'zh-CN' : 'en-US';
const firstDate = () => DB.entries.length ? DB.entries[0].date : null;
const lastDate = () => DB.entries.length ? DB.entries[DB.entries.length - 1].date : null;

function fmtDay(s, opts = { month: 'short', day: 'numeric' }) { return parseD(s).toLocaleDateString(loc(), opts); }
function fmtDayLong(s) {
  const td = today();
  if (s === td) return t('today');
  if (s === addDays(td, -1)) return t('yesterday');
  const sameYear = s.slice(0, 4) === td.slice(0, 4);
  return parseD(s).toLocaleDateString(loc(), { weekday: 'short', month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
}
function fmtMonth(s, long) {
  return parseD(s).toLocaleDateString(loc(), long ? { month: 'long', year: 'numeric' } : { month: 'short' });
}

function periodRange(type, offset = 0) {
  const td = today(), d = parseD(td);
  let from, to;
  if (type === 'week') {
    const s = new Date(d); s.setDate(d.getDate() - (d.getDay() + 6) % 7 + offset * 7);
    from = ymd(s); to = addDays(from, 6);
  } else if (type === 'month') {
    const s = new Date(d.getFullYear(), d.getMonth() + offset, 1);
    from = ymd(s); to = ymd(new Date(s.getFullYear(), s.getMonth() + 1, 0));
  } else if (type === 'quarter') {

function periodLabel(r) {

      if (r.offset === -1) return t('period.lastWeek');
      return `${fmtDay(r.from)} – ${fmtDay(r.to)}`;
    case 'month': return fmtMonth(r.from, true);
    case 'quarter': { const q = Math.floor(f.getMonth() / 3) + 1; return LANG === 'zh' ? `${f.getFullYear()}年 Q${q}` : `Q${q} ${f.getFullYear()}`; }
    case 'year': return LANG === 'zh' ? `${f.getFullYear()}年` : String(f.getFullYear());

/* fraction of a range already lived through (for goal pacing) */
function elapsed(r) {

/* ---- aggregation ---- */
const ctxCache = new Map();
const firstStage = () => DB.stages[0].id;
const wonStage = () => DB.stages[DB.stages.length - 1].id;
const stageName = s => s.label || t('stage.' + s.id);
const stageById = id => DB.stages.find(s => s.id === id);
function inputKeys() { return [...DB.stages.map(s => s.id), ...MONEY_FIELDS, 'churned']; }

/* totals include every entry; pass a variant id to sum only that A/B test variant */
function sumRange(from, to, variant) {
  const S = {};
  for (const k of inputKeys()) S[k] = 0;
  let n = 0;
  for (const e of DB.entries) {
    if (e.date < from) continue;
    if (e.date > to) break;
    if (variant && e.t !== variant) continue;
    n++;
    for (const k in e.v) if (k in S) S[k] += e.v[k];
  }
  return { S, n };
}
/* A ctx is everything metrics need for one date range. Unit economics (ARPA, churn, LTV,
   payback) are noisy over a week, so they read ctx.U: the period itself when it spans
   90+ days, otherwise the trailing 90 days ending with it (never before the first entry). */
function ctxFor(from, to, noUnit) {
  const key = from + '|' + to + (noUnit ? '|n' : '');
  let c = ctxCache.get(key);
  if (c) return c;
  const { S, n } = sumRange(from, to);
  const won = wonStage();
  let startA = +DB.settings.startCust || 0;
  for (const e of DB.entries) { if (e.date >= from) break; startA += (e.v[won] || 0) - (e.v.churned || 0); }
  const endA = startA + S[won] - S.churned;
  const td = today();
  const effTo = from <= td && to > td ? td : to;
  const days = Math.max(1, daysBetween(from, effTo) + 1);
  c = { from, to, effTo, S, n, days, months: days / 30.4375, startA: Math.max(0, startA), endA: Math.max(0, endA), avgA: Math.max(0, (startA + endA) / 2) };
  if (!noUnit) {
    let uf = days >= 90 ? from : addDays(effTo, -89);
    const fd = firstDate();
    if (fd && uf < fd) uf = fd < effTo ? fd : effTo;
    c.U = (uf === from && effTo === to) ? c : ctxFor(uf, effTo, true);
  } else c.U = c;
  ctxCache.set(key, c);
  return c;
}

/* ---- metric registry ---- */
let METRICS = [], MX = {};
const revenueOf = S => S.revNew + S.revRec;
const acqOf = S => S.mkt + S.sales;
function unit(c) {
  const U = c.U, S = U.S, rev = revenueOf(S);
  const arpa = U.avgA > 0 ? rev / U.avgA / Math.max(U.months, 1 / 30) : null;
  const denom = U.startA > 0 ? U.startA : U.startA + S[wonStage()];
  const churn = denom > 0 ? Math.min(1, S.churned / denom / Math.max(U.months, 1)) : null;
  const gm = rev ? (rev - S.cogs) / rev : null;
  const cac = S[wonStage()] ? acqOf(S) / S[wonStage()] : null;
  const cap = Math.max(1, +DB.settings.lifeCap || 36);
  const life = churn == null ? null : churn > 0 ? Math.min(1 / churn, cap) : cap;
  const ltv = arpa != null && gm != null && life != null ? arpa * gm * life : null;
  return { arpa, churn, gm, cac, life, ltv };
}

/* ---- formatting ---- */
function curSym() { const s = DB.settings.currency || '$'; return /[A-Za-z]$/.test(s) ? s + ' ' : s; }
function fmtNum(v, maxFrac = 0) { return v.toLocaleString(loc(), { maximumFractionDigits: maxFrac }); }
function fmtVal(v, fmt, compact) {
  if (v == null || !fin(v)) return '—';
  const neg = v < 0, a = Math.abs(v);
  let s;
  switch (fmt) {
    case 'money':
      if (compact && a >= 1e5) s = curSym() + a.toLocaleString(loc(), { notation: 'compact', maximumFractionDigits: 1 });
      else s = curSym() + a.toLocaleString(loc(), { minimumFractionDigits: a < 100 && a % 1 ? 2 : 0, maximumFractionDigits: a < 100 ? 2 : 0 });
      break;
    case 'pct': s = fmtNum(a * 100, a * 100 < 10 ? 2 : 1) + '%'; break;
    case 'ratio': s = fmtNum(a, a < 10 ? 2 : 1) + '×'; break;
    case 'months': s = fmtNum(a, 1) + (LANG === 'zh' ? ' ' : ' ') + t('u.mo'); break;
    case 'num1': s = fmtNum(a, 1); break;
    default: s = compact && a >= 1e6 ? a.toLocaleString(loc(), { notation: 'compact', maximumFractionDigits: 1 }) : fmtNum(a, a % 1 ? 1 : 0);
  }
  return (neg ? '−' : '') + s;
}
/* change vs previous period; returns null when there is nothing meaningful to compare */
function delta(cur, prev, fmt, better) {
  if (cur == null || prev == null || !fin(cur) || !fin(prev)) return null;
  let dir, text;
  if (fmt === 'pct') {
    const d = (cur - prev) * 100;
    dir = Math.abs(d) < 0.05 ? 0 : Math.sign(d);
    text = (d > 0 ? '+' : d < 0 ? '−' : '') + fmtNum(Math.abs(d), 1) + ' ' + t('u.pt');
  } else {
    if (prev === 0) return cur === 0 ? { dir: 0, text: '0%', cls: '' } : null;
    const r = (cur - prev) / Math.abs(prev);
    dir = Math.abs(r) < 0.0005 ? 0 : Math.sign(r);
    const p = Math.abs(r * 100);
    text = (dir > 0 ? '+' : dir < 0 ? '−' : '') + (p > 999 ? '999+' : fmtNum(p, p < 10 ? 1 : 0)) + '%';
  }
  const cls = !dir || !better ? '' : (dir > 0) === (better === 'up') ? 'good' : 'bad';
  return { dir, text, cls };
}

/* ---- buckets for charts ---- */
function bucketsFor(r) {
  const out = [];
  const span = daysBetween(r.from, r.to) + 1;
  if (r.type === 'week' || r.type === 'month' || (r.type === 'all' && span <= 45)) {
    for (let d = r.from; d <= r.to; d = addDays(d, 1)) out.push({ from: d, to: d, label: fmtDay(d), axis: fmtDay(d, { day: 'numeric' }) });
  } else if (r.type === 'quarter' || (r.type === 'all' && span <= 180)) {
    let d = parseD(r.from); d.setDate(d.getDate() - (d.getDay() + 6) % 7);
    for (let s = ymd(d); s <= r.to; s = addDays(s, 7)) {
      const f = s < r.from ? r.from : s, e = addDays(s, 6) > r.to ? r.to : addDays(s, 6);
      out.push({ from: f, to: e, label: `${fmtDay(f)} – ${fmtDay(e)}`, axis: fmtDay(f) });
    }
  } else {
    const f = parseD(r.from);
    for (let m = new Date(f.getFullYear(), f.getMonth(), 1); ymd(m) <= r.to; m = new Date(m.getFullYear(), m.getMonth() + 1, 1)) {
      const s = ymd(m), e = ymd(new Date(m.getFullYear(), m.getMonth() + 1, 0));
      out.push({ from: s, to: e > r.to ? r.to : e, label: fmtMonth(s, true), axis: fmtMonth(s) });
    }
  }
  return out;
}
/* the previous n periods of the same kind, oldest first (sparklines, metric history) */
function historyRanges(type, offset, n) {
  const k = type === 'all' ? 'month' : type;
  const base = type === 'all' ? 0 : offset;
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const r = periodRange(k, base - i); out.push({ ...r, label: periodLabel(r), axis: shortPeriod(r) }); }
  return out;
}
function shortPeriod(r) {
  if (r.type === 'week') return fmtDay(r.from);
  if (r.type === 'month') return fmtMonth(r.from);
  if (r.type === 'quarter') return 'Q' + (Math.floor(parseD(r.from).getMonth() / 3) + 1);
  return r.from.slice(0, 4);
}

/* ---- goals ---- */
function goalStatus(g) {
  const m = MX[g.metric];
  if (!m) return null;
  const r = periodRange(g.period, 0);
  const v = m.calc(ctxFor(r.from, r.to));
  const target = +g.target || 0;
  const fr = elapsed(r);
  const daysLeft = Math.max(0, daysBetween(today(), r.to));
  let progress = 0, status = 'behind', projected = null;
  if (m.better === 'down') {
    if (v == null) { status = 'na'; progress = 0; }
    else {
      projected = m.additive && fr > 0 ? v / fr : v;
      progress = projected <= target ? 1 : clamp(target / projected, 0, 1);
      status = m.additive ? (v > target ? 'over' : projected <= target ? 'onTrack' : 'behind') : (v <= target ? 'onTrack' : 'over');
      if (m.additive) progress = clamp(v / (target || 1), 0, 1);
    }
  } else {
    progress = v == null || target <= 0 ? 0 : clamp(v / target, 0, 1);
    if (v != null && v >= target) status = 'done';
    else if (m.additive) {
      projected = fr > 0 ? (v || 0) / fr : 0;
      status = fr <= 1 / 7 && !v ? 'onTrack' : projected >= target ? 'onTrack' : 'behind';
      if (fr >= 1) status = 'behind';
    } else status = v == null ? 'na' : 'behind';
  }
  return { m, r, v, target, progress, status, projected, daysLeft, fr };
}

/* ---- Hormozi mode: Rule of 100, bottleneck, coach ---- */
const hzOn = () => DB.settings.hz !== false;
function r100Stage() { const id = DB.settings.r100Stage; return id && stageById(id) ? id : stageById('contacted') ? 'contacted' : firstStage(); }
const r100Target = () => clamp(Math.round(+DB.settings.r100 || 100), 1, 100000);

  const el = document.createElement('div');

function setQuick(stageId, value, date = UI.quick) {
  const qv = variantById(UI.qv) ? UI.qv : '';
  const watch = hzOn() && date === today() && stageId === r100Stage();   // Rule of 100 milestones
  const before = watch ? r100State().today : 0;
  let e = findEntry(date, qv);
  if (!e) { e = { id: uid(), date, v: {}, note: '', ...(qv ? { t: qv } : {}) }; DB.entries.push(e); }
  const n = Math.max(0, Math.round(value));
  if (n) e.v[stageId] = n; else delete e.v[stageId];
  if (!Object.keys(e.v).length && !e.note) DB.entries.splice(DB.entries.indexOf(e), 1);
  commit();
  if (watch) hzMilestone(before, r100State().today);
  return n;
}

/* ---- A/B tests ---- */
/* two-proportion z-test; |z| >= 1.96 means the gap is unlikely to be luck (95% confidence) */
function zScore(x1, n1, x2, n2) {
  if (!n1 || !n2) return 0;
  const p = (x1 + x2) / (n1 + n2), se = Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2));
  return se ? Math.abs(x1 / n1 - x2 / n2) / se : 0;
}
function testCard(ts, r) {
  const vs = ts.variants, st = DB.stages;
  const sums = vs.map(v => sumRange(r.from, r.to, v.id).S);
  // compare conversion steps from the first stage logged under this test to the last one
  let last = -1;
  st.forEach((s, i) => { if (sums.some(S => S[s.id] > 0)) last = i; });
  const rows = [];
  for (let i = 1; i <= last; i++) {
    const a = st[i - 1].id, b = st[i].id;
    if (sums.some(S => S[a] > 0)) rows.push({ key: 'conv:' + b, a, b });
  }
  const head = `<div class="srow"><b class="tt1">${esc(ts.name)}</b><span class="sp"></span><button class="link" data-open="test:${esc(ts.id)}">${esc(t('edit'))}</button></div>`;
  if (!rows.length) return `<div class="card test">${head}<p class="small muted" style="margin:10px 0 2px">${esc(t('tv.noData'))}</p></div>`;
  const base = rows[0].a;
  const body = rows.map(row => {
    const rates = sums.map(S => div(S[row.b], S[row.a]));
    const order = rates.map((x, i) => [x, i]).filter(([x]) => x != null).sort((p, q) => q[0] - p[0]);
    const top = order.length ? order[0][0] : 0;
    let badge = '', best = -1;
    if (order.length >= 2) {
      const i1 = order[0][1], i2 = order[1][1], n1 = sums[i1][row.a], n2 = sums[i2][row.a];
      if (order[0][0] > order[1][0]) best = i1;
      if (Math.min(n1, n2) < 30) badge = `<span class="tbadge small">${esc(t('tv.small'))}</span>`;
      else if (best >= 0 && zScore(sums[i1][row.b], n1, sums[i2][row.b], n2) >= 1.96) badge = `<span class="tbadge sig">${esc(t('tv.sig', { v: vs[i1].name }))}</span>`;
      else badge = `<span class="tbadge">${esc(t('tv.tie'))}</span>`;
    }
    const cells = sums.map((S, i) => `<td class="${i === best ? 'best' : ''}"><div class="num tv">${esc(fmtVal(rates[i], 'pct'))}</div>
      <div class="tsub num">${fmtNum(S[row.b])} / ${fmtNum(S[row.a])}</div><i class="tbar" style="--w:${top && rates[i] != null ? rates[i] / top * 100 : 0}%"></i></td>`).join('');
    return `<tr><td><div>${nameHTML(row.key)}</div>${badge}</td>${cells}</tr>`;
  }).join('');
  // two variants fit a phone screen; more than that scrolls inside the card, never the page
  return `<div class="card test">${head}<div class="tscroll"><table class="ttable" style="min-width:${112 + vs.length * 84}px">
    <thead><tr><th></th>${vs.map(v => `<th>${esc(v.name)}</th>`).join('')}</tr></thead>
    <tbody><tr class="tn"><td class="muted">${esc(stageName(stageById(base)))}</td>${sums.map(S => `<td class="num muted">${fmtNum(S[base])}</td>`).join('')}</tr>${body}</tbody>
  </table></div></div>`;
}

        v => { UI.mview = v; saveUI(); render(); }, { full: true }).el);

    else if (hit) { hit.v = v; hit.note = note; }

/* ---------------------------------------------------------- cloud sync -- */
/* Local-first. Every change is saved in this browser at once, then pushed to a Supabase "vault"
   identified by a random sync key. Devices merge record by record using change stamps (u) and
   tombstones (del), so edits made offline on two devices both survive; newest edit wins. */
const SB_URL = 'https://rlaeklherxdfrlbduqde.supabase.co';
// publishable key: safe to ship — the tables are locked and only reachable through key-checked functions
const SB_KEY = 'sb_publishable_jTrhtpvVi1vPFMDby_XLEQ_KY2SkXyb';
const SYNCKEY = 'pulse.sync';
const TOMB_TTL = 180 * 864e5;

const DEL_BUCKETS = ['e', 'g', 'c', 't'];   // tombstones for entries, goals, custom metrics, tests
function cleanDel(d) {
  const out = { e: {}, g: {}, c: {}, t: {} }, now = Date.now();
  if (d && typeof d === 'object') for (const b of DEL_BUCKETS) for (const k in (d[b] || {})) {
    const n = +d[b][k];
    if (n > 0 && now - n < TOMB_TTL) out[b][k] = n;
  }
  return out;
}

/* ---- change stamping: compare with the last known state ---- */
let SNAP = null;
const recSig = r => JSON.stringify({ ...r, u: 0 });
const settingsSig = s => JSON.stringify({ ...s, lang: null, theme: null });   // language and theme stay per device
function snapshot() {
  SNAP = {
    e: new Map(DB.entries.map(r => [entryKey(r), recSig(r)])),
    g: new Map(DB.goals.map(r => [r.id, recSig(r)])),
    c: new Map(DB.custom.map(r => [r.id, recSig(r)])),
    t: new Map(DB.tests.map(r => [r.id, recSig(r)])),
    st: JSON.stringify(DB.stages), set: settingsSig(DB.settings), nm: stable(DB.names || {}), del: cleanDel(DB.del)
  };
}
function stamp() {
  if (!SNAP) { snapshot(); return; }
  const now = Date.now(), del = cleanDel(DB.del);
  for (const b of DEL_BUCKETS) for (const k in SNAP.del[b]) del[b][k] = Math.max(del[b][k] || 0, SNAP.del[b][k]);
  const walk = (list, keyOf, prev, b) => {
    const seen = new Set();
    for (const r of list) {
      const k = keyOf(r); seen.add(k);
      if (prev.get(k) !== recSig(r)) { r.u = now; delete del[b][k]; }
    }
    for (const k of prev.keys()) if (!seen.has(k)) del[b][k] = now;
  };
  walk(DB.entries, entryKey, SNAP.e, 'e');
  walk(DB.goals, r => r.id, SNAP.g, 'g');
  walk(DB.custom, r => r.id, SNAP.c, 'c');
  walk(DB.tests, r => r.id, SNAP.t, 't');
  DB.del = del;
  if (JSON.stringify(DB.stages) !== SNAP.st) DB.su = now;
  if (settingsSig(DB.settings) !== SNAP.set) DB.setu = now;
  if (stable(DB.names || {}) !== SNAP.nm) DB.nu = now;
  DB.fv = DATA_FV;
  snapshot();
}

/* ---- merge ---- */
function mergeDB(local, remoteRaw) {
  const R = normalize(remoteRaw), L = local;
  const del = cleanDel(L.del), rd = cleanDel(R.del);
  for (const b of DEL_BUCKETS) for (const k in rd[b]) del[b][k] = Math.max(del[b][k] || 0, rd[b][k]);
  const pick = (loc, rem, keyOf, b) => {
    const m = new Map();
    for (const r of rem) m.set(keyOf(r), r);
    for (const r of loc) { const k = keyOf(r), o = m.get(k); if (!o || (r.u || 0) > (o.u || 0)) m.set(k, r); }
    return [...m.values()].filter(r => { const tomb = del[b][keyOf(r)]; return !(tomb && tomb >= (r.u || 0)); });
  };
  return {
    v: 1, fv: DATA_FV,
    settings: { ...((L.setu || 0) > (R.setu || 0) ? L.settings : R.settings), lang: L.settings.lang, theme: L.settings.theme },
    stages: (L.su || 0) > (R.su || 0) ? L.stages : R.stages,
    entries: pick(L.entries, R.entries, entryKey, 'e').sort(byEntry),
    goals: pick(L.goals, R.goals, r => r.id, 'g'),
    custom: pick(L.custom, R.custom, r => r.id, 'c'),
    tests: pick(L.tests || [], R.tests, r => r.id, 't'),
    names: (L.nu || 0) > (R.nu || 0) ? (L.names || {}) : R.names,
    su: Math.max(L.su || 0, R.su || 0), setu: Math.max(L.setu || 0, R.setu || 0), nu: Math.max(L.nu || 0, R.nu || 0), del
  };
}
const hasLocalData = () => !!(DB.entries.length || DB.goals.length || DB.custom.length || DB.tests.length);
/* key-order-independent fingerprint, so two devices never disagree about "same data" and ping-pong */
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v ?? null);
}
const syncSig = d => stable({ ...d, v: 1, settings: { ...d.settings, lang: null, theme: null } });

function refreshAfterSync() {
  const ae = document.activeElement;
  if (SHEETS.length || (ae && ae !== document.body && ae.matches('input,select,textarea'))) { Sync.pendingRender = true; return; }
  Sync.pendingRender = false;
  renderShell(); render();
}
function ago(ts) {
  if (!ts) return '—';
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return t('sync.justNow');
  if (m < 60) return t('sync.minAgo', { n: m });
  if (m < 1440) return t('sync.hAgo', { n: Math.floor(m / 60) });
  return fmtDay(ymd(new Date(ts)));
}

const Sync = {
  st: null,            // { key, version, dirty, last } — kept apart from DB so backups never contain the key
  status: 'off', msg: '', timer: 0, busy: false, again: false, gen: 0, pendingRender: false,
  load() {
    try { this.st = JSON.parse(localStorage.getItem(SYNCKEY) || 'null'); } catch (e) { this.st = null; }
    if (this.st && !this.st.key) this.st = null;
    this.status = !this.st ? 'off' : this.st.dirty ? 'pending' : 'idle';
  },
  persist() { try { if (this.st) localStorage.setItem(SYNCKEY, JSON.stringify(this.st)); else localStorage.removeItem(SYNCKEY); } catch (e) { } },
  on() { return !!(this.st && this.st.key); },
  async rpc(fn, args) {
    const body = JSON.stringify(args);
    const res = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST', cache: 'no-store', body,
      headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
      keepalive: document.hidden && body.length < 60000     // lets the last push finish as the app is closed
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  },
  dirty() {
    if (!this.on()) return;
    this.gen++; this.st.dirty = true; this.persist();
    if (!this.busy) this.setStatus('pending');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), 1200);
  },
  async run() {
    if (!this.on()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    const key = this.st.key, still = () => this.st && this.st.key === key;
    try {
      for (let i = 0; i < 5 && still(); i++) {
        if (this.st.dirty) {
          this.setStatus('syncing');
          const g = this.gen;
          const r = await this.rpc('pulse_push', { p_key: key, p_data: DB, p_base: this.st.version });
          if (!still()) return;
          if (r.error === 'conflict') { this.absorb(r.data, r.version); continue; }
          if (r.error) throw new Error(r.error);
          this.st.version = r.version;
          if (this.gen === g) { this.st.dirty = false; break; }
          continue;                                       // edited again while pushing
        }
        const v = await this.rpc('pulse_version', { p_key: key });
        if (!still()) return;
        if (v.error) throw new Error(v.error);
        if (v.version === this.st.version) break;
        this.setStatus('syncing');
        const p = await this.rpc('pulse_pull', { p_key: key });
        if (!still()) return;
        if (p.error) throw new Error(p.error);
        this.absorb(p.data, p.version);
        if (!this.st.dirty) break;
      }
      if (!still()) return;
      this.st.last = Date.now(); this.persist();
      this.setStatus(this.st.dirty ? 'pending' : 'idle');
    } catch (e) {
      if (still()) this.setStatus(e instanceof TypeError || navigator.onLine === false ? 'offline' : 'error', e.message);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.run(); }
    }
  },
  /* fold server data into local; stay dirty if local holds changes the server lacks */
  absorb(remote, version) {
    const merged = mergeDB(DB, remote);
    this.st.version = version;
    if (syncSig(merged) !== syncSig(normalize(remote))) { this.st.dirty = true; this.gen++; }
    else this.st.dirty = false;
    if (syncSig(merged) !== syncSig(DB)) {
      DB = merged; ctxCache.clear(); snapshot(); save(); rebuildMetrics();
      refreshAfterSync();
    }
    this.persist();
  },
  async enable() {
    if (this.on() || this.busy) return;
    this.busy = true; this.setStatus('syncing');
    try {
      const r = await this.rpc('pulse_create', { p_data: DB });
      if (r.error || !r.key) throw new Error(r.error || 'no key');
      this.st = { key: r.key, version: r.version, dirty: false, last: Date.now() };
      this.persist(); this.setStatus('idle');
      toast(t('sync.enabled')); render(); openPair();
    } catch (e) {
      this.st = null; this.setStatus('off');
      toast(e instanceof TypeError ? t('sync.netErr') : t('sync.st.error', { m: e.message }));
    } finally { this.busy = false; }
  },
  /* joining, step 1: a pairing code (single use) or a full key → the sync key */
  async resolve(raw) {
    const clean = String(raw || '').replace(/[^A-Za-z0-9]/g, '');
    if (clean.length >= 40) return { key: clean.toLowerCase() };
    const c = await this.rpc('pulse_pair_claim', { p_code: clean });
    if (c.error) return { error: t(c.error === 'locked' ? 'sync.locked' : 'sync.badCode') };
    return { key: c.key };
  },
  async peek(key) {
    const p = await this.rpc('pulse_pull', { p_key: key });
    return p.error ? { error: t('sync.badKey') } : { p };
  },
  /* joining, step 2. merge: fold both together (this device's data gets uploaded).
     replace: become an exact copy of the cloud — no tombstones are created, so the cloud loses nothing. */
  attach(key, p, mode) {
    try { localStorage.setItem(LSKEY + '.beforeSync', JSON.stringify(DB)); } catch (e) { }   // safety copy of this device's data
    this.st = { key, version: p.version, dirty: false, last: Date.now() };
    if (mode === 'replace') {
      const R = normalize(p.data);
      DB = { ...R, settings: { ...R.settings, lang: DB.settings.lang, theme: DB.settings.theme } };
      ctxCache.clear(); snapshot(); save(); rebuildMetrics();
    } else this.absorb(p.data, p.version);
    this.persist(); this.setStatus(this.st.dirty ? 'pending' : 'idle');
    if (this.st.dirty) this.run();
  },
  label() {
    switch (this.status) {
      case 'syncing': return t('sync.st.syncing');
      case 'pending': return t('sync.st.pending');
      case 'offline': return t('sync.st.offline');
      case 'error': return this.msg === 'bad_key' ? t('sync.st.badKey') : this.msg === 'outdated' ? t('sync.st.outdated') : t('sync.st.error', { m: this.msg || '' });
      default: return t('sync.st.idle', { ago: ago(this.st && this.st.last) });
    }
  },
  setStatus(s, msg = '') { this.status = s; this.msg = msg; this.paint(); },
  paint() {
    const b = $('#syncBtn');
    if (b) {
      b.hidden = !this.on();
      if (!b.firstChild) b.innerHTML = icon('cloud', 1.9) + '<i></i>';
      b.dataset.s = this.status;
      b.title = this.label();
    }
    const s = $('#syncStatus');
    if (s) { s.textContent = this.label(); s.style.color = this.status === 'error' ? 'var(--red)' : ''; }
  },
  start() {
    this.paint();
    if (this.on()) this.run();
    setInterval(() => {
      if (this.pendingRender) refreshAfterSync();
      if (this.on() && !document.hidden) this.run(); else this.paint();
    }, 20000);
    document.addEventListener('visibilitychange', () => {
      if (!this.on()) return;
      if (!document.hidden) this.run();
      else if (this.st.dirty) { clearTimeout(this.timer); this.run(); }
    });
    addEventListener('online', () => { if (this.on()) this.run(); });
    addEventListener('pageshow', e => { if (e.persisted && this.on()) this.run(); });
  }
};

function openPair() {
  if (!Sync.on()) return;
  let timer = 0, end = 0;
  const url = /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : 'https://yong0225.github.io/Claude-Project/business-tracker/';
  const sh = openSheet({
    title: t('sync.pairTitle'), small: true, right: { label: t('done'), fn: api => api.close() }, onClose: () => clearInterval(timer),
    body: `<div class="card">
      <div class="small muted">1. ${esc(t('sync.pairStep1'))}</div>
      <div class="small" style="word-break:break-all;margin:2px 0 10px;font-weight:600">${esc(url)}</div>
      <div class="small muted">2. ${esc(t('sync.pairStep2'))}</div>
      <div class="small muted" style="margin-top:10px">3. ${esc(t('sync.pairStep3'))}</div>
      <div class="paircode" data-code style="opacity:.3">····-····</div>
      <div class="small muted num" style="text-align:center" data-exp>${esc(t('sync.working'))}</div></div>
      <div style="margin-top:16px"><button class="btn sec block" data-new>${esc(t('sync.newCode'))}</button></div>`
  });
  const codeEl = $('[data-code]', sh.body), expEl = $('[data-exp]', sh.body);
  const tick = () => {
    const ms = end - Date.now();
    if (ms <= 0) { clearInterval(timer); codeEl.style.opacity = .3; expEl.textContent = t('sync.expired'); return; }
    const s = Math.ceil(ms / 1000);
    expEl.textContent = t('sync.expiresIn', { t: `${Math.floor(s / 60)}:${pad(s % 60)}` });
  };
  const fetchCode = async () => {
    clearInterval(timer); codeEl.style.opacity = .3; expEl.textContent = t('sync.working');
    try {
      const r = await Sync.rpc('pulse_pair_start', { p_key: Sync.st.key });
      if (r.error) throw new Error(r.error);
      codeEl.textContent = r.code.slice(0, 4) + '-' + r.code.slice(4);
      codeEl.style.opacity = 1;
      end = Date.now() + 10 * 60 * 1000;
      tick(); timer = setInterval(tick, 1000);
    } catch (e) { expEl.textContent = e instanceof TypeError ? t('sync.netErr') : t('sync.st.error', { m: e.message }); }
  };
  $('[data-new]', sh.body).addEventListener('click', fetchCode);
  fetchCode();
}

function openJoin() {
  let busy = false, key = null;   // the key is kept once resolved: a pairing code only works once
  const counts = d => t('sync.counts', { e: fmtNum(d.entries.length), g: fmtNum(d.goals.length) });
  const sh = openSheet({
    title: t('sync.joinTitle'), small: true, left: { label: t('cancel') }, right: { label: t('sync.connect'), fn: api => submit(api) },
    body: `<div class="list"><div class="row"><input class="inl" data-code placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="80" enterkeyhint="go"
        style="text-align:center;font-size:22px;letter-spacing:.08em;text-transform:uppercase;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace"></div></div>
      <div class="gf danger hide" data-err></div><div class="gf">${esc(t('sync.joinHint'))}</div>`
  });
  const inp = $('[data-code]', sh.body), err = $('[data-err]', sh.body);
  const finish = api => { inp.blur(); api.close(); renderShell(); render(); toast(t('sync.joined')); };
  const choose = (api, p) => {
    api.setRight(true);
    sh.body.innerHTML = `<p class="note" style="text-align:center;margin:2px 4px 14px;color:var(--text)">${esc(t('sync.choiceQ'))}</p>
      <div class="list">
        <div class="row"><div class="bd"><div class="t1">${esc(t('sync.thisDevice'))}</div></div><div class="rv num">${esc(counts(DB))}</div></div>
        <div class="row"><div class="bd"><div class="t1">${esc(t('sync.cloud'))}</div></div><div class="rv num">${esc(counts(normalize(p.data)))}</div></div>
      </div>
      <div style="margin-top:20px">
        <button class="btn block" data-mode="merge">${esc(t('sync.merge'))}</button><div class="gf" style="margin:6px 4px 18px">${esc(t('sync.mergeF'))}</div>
        <button class="btn sec block" data-mode="replace">${esc(t('sync.replace'))}</button><div class="gf" style="margin:6px 4px 0">${esc(t('sync.replaceF'))}</div>
      </div>`;
    sh.body.addEventListener('click', ev => {
      const b = ev.target.closest('[data-mode]');
      if (!b) return;
      Sync.attach(key, p, b.dataset.mode); finish(api);
    });
  };
  async function submit(api) {
    if (busy) return;
    if (!key && !inp.value.trim()) { inp.focus(); return; }
    busy = true; api.setRight(true); err.classList.add('hide');
    let msg = null;
    try {
      if (!key) { const r = await Sync.resolve(inp.value); if (r.error) msg = r.error; else key = r.key; }
      if (!msg) {
        const pk = await Sync.peek(key);
        if (pk.error) { msg = pk.error; key = null; }
        else if (hasLocalData()) { busy = false; choose(api, pk.p); return; }
        else { Sync.attach(key, pk.p, 'merge'); busy = false; finish(api); return; }
      }
    } catch (e) { msg = e instanceof TypeError ? t('sync.netErr') : t('sync.st.error', { m: e.message }); }
    busy = false; api.setRight(false);
    if (msg) { err.textContent = msg; err.classList.remove('hide'); }
  }
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(sh); } });
  if (innerWidth >= 720) setTimeout(() => inp.focus(), 60);
}
function openKey() {
  if (!Sync.on()) return;
  const sh = openSheet({
    title: t('sync.keyTitle'), small: true, right: { label: t('done'), fn: api => api.close() },
    body: `<div class="formula" data-key style="white-space:normal;word-break:break-all;font-size:15px;text-align:center">${esc(Sync.st.key)}</div>
      <div style="margin-top:14px"><button class="btn block" data-copy>${esc(t('sync.copy'))}</button></div>
      <p class="note">${esc(t('sync.keyNote'))}</p>`
  });
  $('[data-copy]', sh.body).addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(Sync.st.key); toast(t('sync.copied')); }
    catch (e) { const r = document.createRange(); r.selectNodeContents($('[data-key]', sh.body)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
}

function applyTheme() {

  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  else delete document.documentElement.dataset.theme;
}
function setLang(l) {
  if (l === LANG) return;
  LANG = l; DB.settings.lang = l; save();
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : 'en';
  if (PB) { PB.seg.relabel(PERIODS.map(p => t('period.' + p))); PB.text = ''; }
  renderShell(); render();
}

let logRefresh = 0;
function scheduleLogRefresh() {
  clearTimeout(logRefresh);
  logRefresh = setTimeout(() => {
    if (document.activeElement && document.activeElement.matches('[data-qv]')) return scheduleLogRefresh();
    render();
  }, 900);
}

document.addEventListener('click', async e => {
  const el = e.target;
  if (el.closest('[data-rename]')) return;          // tapping a name edits it instead of opening the row
  const tab = el.closest('[data-tab]');
  if (tab) { switchTab(tab.dataset.tab); return; }
  const open = el.closest('[data-open]');
  if (open) {
    const [kind, ...rest] = open.dataset.open.split(':'), id = rest.join(':');
    if (kind === 'metric') openMetric(id);
    else if (kind === 'entry') openEntry(id);
    else if (kind === 'goal') openGoal(id);
    else if (kind === 'custom') openCustom(id);
    else if (kind === 'test') openTest(id);
    return;
  }
  const tr = el.closest('[data-trend]');
  if (tr) { UI.trend = tr.dataset.trend; saveUI(); $$('[data-trend]').forEach(b => b.classList.toggle('on', b === tr)); mountTrend(); return; }
  const step = el.closest('[data-step]');
  if (step) {
    const id = step.dataset.step, inp = $(`[data-qv="${CSS.escape(id)}"]`);
    const n = setQuick(id, parseNum(inp.value) + +step.dataset.d);
    inp.value = fmtNum(n);
    inp.classList.remove('bump'); void inp.offsetWidth; inp.classList.add('bump');
    haptic(); paintR100(); scheduleLogRefresh();
    return;
  }
  const qp = el.closest('[data-qvpick]');
  if (qp) { UI.qv = qp.dataset.qvpick; saveUI(); haptic(); render(); return; }
  const qd = el.closest('[data-qd]');
  if (qd) { const d = addDays(UI.quick, +qd.dataset.qd); UI.quick = d > today() ? today() : d; render(); return; }
  const sm = el.closest('[data-smove]');
  if (sm) {
    const i = +sm.dataset.smove, j = i + +sm.dataset.d;
    if (j < 0 || j >= DB.stages.length) return;
    [DB.stages[i], DB.stages[j]] = [DB.stages[j], DB.stages[i]];
    commit(); rebuildMetrics(); render(); return;
  }
  const sd = el.closest('[data-sdel]');
  if (sd) {
    if (DB.stages.length <= 2) { toast(t('s.minStages')); return; }
    const before = DB.stages.map(s => ({ ...s })), gone = DB.stages[+sd.dataset.sdel];
    DB.stages.splice(+sd.dataset.sdel, 1);
    commit(); rebuildMetrics(); render();
    toast(`${stageName(gone)} — ${t('delete')}`, { label: t('undo'), fn: () => { DB.stages = before; commit(); rebuildMetrics(); render(); } });
    return;
  }
  const act = el.closest('[data-act]');
  if (!act) return;
  switch (act.dataset.act) {
    case 'add': openEntry(); break;
    case 'addq': openEntry(quickKey()); break;
    case 'newtest': openTest(); break;
    case 'coachnext': coachNext(act); break;
    case 'rulenext': ruleNext(act); break;
    case 'r100plus': {
      const sid = r100Stage(), td = today(), e = findEntry(td, variantById(UI.qv) ? UI.qv : '');
      setQuick(sid, (e && e.v[sid] || 0) + 1, td);
      haptic(); paintR100(); scheduleLogRefresh();
      break;
    }
    case 'newgoal': openGoal(); break;
    case 'newcustom': openCustom(); break;
    case 'more': UI.histLimit += 60; render(); break;
    case 'export': download(`pulse-backup-${today()}.json`, JSON.stringify(DB, null, 2), 'application/json'); break;
    case 'import': importJSON(); break;
    case 'csv': exportCSV(); break;
    case 'sync-enable': openEnableAsk(); break;
    case 'sync-join': openJoin(); break;
    case 'sync-pair': openPair(); break;
    case 'sync-now': Sync.run(); break;
    case 'sync-key': openKey(); break;
    case 'sync-off':
      if (!(await confirmSheet(t('sync.offQ'), t('sync.off')))) return;
      Sync.st = null; Sync.persist(); Sync.setStatus('off'); render();
      break;
    case 'addstage': {
      const s = { id: 's' + uid(), label: t('s.newStage') };
      DB.stages.splice(DB.stages.length - 1, 0, s);
      commit(); rebuildMetrics(); render();
      const inp = $(`[data-stage="${CSS.escape(s.id)}"]`); if (inp) { inp.focus(); inp.select(); }
      break;
    }
    case 'sample':
      if (DB.entries.length && !(await confirmSheet(t('s.sampleQ'), t('s.sample'), false))) return;
      DB = sampleDB(); commit(); afterDataReplaced(); toast(t('s.sampled'));
      break;
    case 'erase':
      if (!(await confirmSheet(t('s.eraseQ'), t('s.erase')))) return;
      DB = defaultDB(); DB.settings.lang = LANG; commit(); afterDataReplaced(); toast(t('s.erased'));
      break;
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set) {
    const k = el.dataset.set;
    let v = el.value;
    if (k === 'startCust') v = Math.max(0, Math.round(parseNum(v)));
    else if (k === 'lifeCap') v = clamp(Math.round(parseNum(v)) || 36, 1, 240);
    else if (k === 'r100') v = clamp(Math.round(parseNum(v)) || 100, 1, 100000);
    else v = v.trim();
    DB.settings[k] = v; commit();
    if (k === 'biz') renderShell();
    if (k === 'r100Stage') rebuildMetrics();
    render(); return;
  }
  if (el.dataset.hz) {
    DB.settings[el.dataset.hz] = el.checked; commit();
    // let the switch finish sliding before the section redraws
    if (el.dataset.hz === 'hz') setTimeout(render, 340);
    return;
  }
  if (el.dataset.stage) {
    const s = stageById(el.dataset.stage); if (!s) return;
    const v = el.value.trim();
    if (v && v !== t('stage.' + s.id)) s.label = v; else delete s.label;
    commit(); rebuildMetrics(); return;
  }
  if (el.dataset.qv) { el.value = fmtNum(setQuick(el.dataset.qv, parseNum(el.value))); paintR100(); scheduleLogRefresh(); }
});
document.addEventListener('focusin', e => { if (e.target.matches('[data-qv]')) setTimeout(() => e.target.select(), 0); });

/* rename in place: focusing a name selects it, leaving the field saves it */
document.addEventListener('focusin', e => {
  const r = e.target.closest && e.target.closest('[data-rename]');
  if (!r) return;
  r.dataset.orig = r.textContent;
  requestAnimationFrame(() => { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(r); s.removeAllRanges(); s.addRange(rg); });
});
document.addEventListener('focusout', e => {
  const r = e.target.closest && e.target.closest('[data-rename]');
  if (!r) return;
  const key = r.dataset.rename;
  if (r.dataset.cancel) { delete r.dataset.cancel; r.textContent = r.dataset.orig; return; }
  const txt = r.textContent.replace(/\s+/g, ' ').trim();
  if (txt === r.dataset.orig) return;
  renameMetric(key, txt);
  const name = MX[key] ? MX[key].name() : r.dataset.orig;
  $$(`[data-rename="${CSS.escape(key)}"]`).forEach(x => { x.textContent = name; });
  // redraw everything else that shows the name, once focus has settled somewhere that isn't another name
  setTimeout(() => { const a = document.activeElement; if (!(a && a.closest && a.closest('[data-rename]'))) render(); }, 0);
});
document.addEventListener('paste', e => {
  const r = e.target.closest && e.target.closest('[data-rename]');
  if (!r) return;
  e.preventDefault();
  document.execCommand('insertText', false, (e.clipboardData ? e.clipboardData.getData('text') : '').replace(/\s+/g, ' '));
});

document.addEventListener('keydown', e => {
  const ren = document.activeElement;
  if (ren && ren.matches && ren.matches('[data-rename]')) {   // renaming: Enter saves, Esc puts the old name back
    if (e.key === 'Enter') { e.preventDefault(); ren.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); ren.dataset.cancel = '1'; ren.blur(); }
    return;
  }
  if (e.key === 'Escape' && SHEETS.length) { SHEETS[SHEETS.length - 1].close(); return; }
  const ae = document.activeElement;
  if ((e.key === 'Enter' || e.key === ' ') && ae && ae.matches('[role="button"]')) { e.preventDefault(); ae.click(); return; }
  if (e.key === 'Enter' && ae && ae.matches('[data-qv]')) { ae.blur(); return; }
  if (SHEETS.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openEntry(UI.view === 'log' ? quickKey() : undefined); }
  else if (/^[1-5]$/.test(e.key)) switchTab(VIEW_KEYS[+e.key - 1]);
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && (UI.view === 'overview' || UI.view === 'metrics')) { e.preventDefault(); shiftPeriod(e.key === 'ArrowLeft' ? -1 : 1); }
});

let scrollRaf = 0;
window.addEventListener('scroll', () => {
  if (scrollRaf) return;
  scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; $('#topbar').classList.toggle('scrolled', window.scrollY > 40); });
}, { passive: true });
$('#addBtn').addEventListener('click', () => openEntry(UI.view === 'log' ? quickKey() : undefined));
$('#langBtn').addEventListener('click', () => setLang(LANG === 'zh' ? 'en' : 'zh'));
$('#syncBtn').addEventListener('click', () => {
  switchTab('settings');
  requestAnimationFrame(() => { const s = $('#sync'); if (s) s.scrollIntoView({ behavior: RM.matches ? 'auto' : 'smooth', block: 'start' }); });
});
window.addEventListener('storage', e => {
  if (e.key === LSKEY) { load(); ctxCache.clear(); afterDataReplaced(); }
  else if (e.key === SYNCKEY) { Sync.load(); Sync.paint(); render(); }
});

(function init() {
  load();
  LANG = DB.settings.lang || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en');
  try {
    const u = JSON.parse(localStorage.getItem('pulse.ui') || '{}');
    if (VIEWS[u.view]) UI.view = u.view;
    if (PERIODS.includes(u.period)) UI.period = u.period;
    if (u.trend) UI.trend = u.trend;
    if (u.mview === 'tests') UI.mview = 'tests';
    if (typeof u.qv === 'string') UI.qv = u.qv;
  } catch (e) { }
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  applyTheme();
  rebuildMetrics();
  if (!MX[UI.trend]) UI.trend = 'revenue';
  Sync.load();
  renderShell();
  render(true);
  Sync.start();
})();
</script>
</body>
</html>
